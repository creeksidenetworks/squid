http_port 3128
# Prevent squid from inheriting Docker's inflated RLIMIT_NOFILE,
# which would cause it to allocate ~432GB for the file descriptor table.
max_filedescriptors 4096
cache_dir ufs /var/spool/squid 10240 16 256
maximum_object_size 50 MB
cache_mem 256 MB

# ACL for servers that need MS365/OIDC access
# Add your server IPs here (one per line or in CIDR notation)
acl ms365_allowed_ips src "/etc/squid/ms365_auth_clients.list"
acl ms365_domains dstdomain "/etc/squid/ms365_auth_domains.list"
acl linux_repos dstdomain "/etc/squid/linux_repos.list"

# ACL for Linux servers allowed to send email via MS365 / Azure Communication Service
acl email_servers src "/etc/squid/ms365_email_clients.list"
acl ms365_email_domains dstdomain "/etc/squid/ms365_email_domains.list"
acl smtp_ports port 587 465   # STARTTLS / SMTPS
acl smtp_connect method CONNECT

# RFC 1918 Private Address Ranges
acl internal_network src 10.0.0.0/8      # Class A
acl internal_network src 172.16.0.0/12   # Class B
acl internal_network src 192.168.0.0/16  # Class C

# Only allow download methods (GET and CONNECT) to whitelisted domains
acl download_methods method GET CONNECT
acl download_methods method GET CONNECT HEAD

# Allow MS365 access for specific IPs (including POST for OIDC auth)
acl ms365_auth_methods method GET POST CONNECT HEAD
http_access allow ms365_allowed_ips ms365_domains ms365_auth_methods

# Allow email servers to CONNECT to MS365 / Azure Communication Service SMTP relays
http_access allow email_servers ms365_email_domains smtp_connect smtp_ports

# Allow general download methods to other whitelisted domains
http_access allow internal_network linux_repos download_methods

# And finally deny all other access to this proxy
http_access deny all


